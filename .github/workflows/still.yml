name: still
# HD stills (2x) for covers: loop frames and full-cut frames, pushed to the film-stills branch.
on:
  push:
    branches: [film]
    paths: [".still"]
permissions:
  contents: write
jobs:
  still:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [loop, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          npm i --no-save playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          mkdir -p out
          if [ "${{ matrix.job }}" = loop ]; then CUT=loop FRAMES=36,43,50,62 DSF=2 PNG=1 OUT=out node pipeline/film.mjs; else FRAMES=230,236,244,250,262 DSF=2 PNG=1 OUT=out node pipeline/film.mjs; fi
          cd out && for f in *.png; do mv "$f" "${{ matrix.job }}_$f"; done; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: "still-${{ matrix.job }}", path: out }
  push:
    needs: still
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "still-*", path: parts, merge-multiple: true }
      - run: |
          cd parts && ls -la && git init -q -b film-stills && git config user.name Claude && git config user.email noreply@anthropic.com
          git add . && git commit -qm "HD stills" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" film-stills
