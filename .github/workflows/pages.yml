name: deploy-and-media
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # The network (docs/data) is built locally with pipeline/build_network.py + analyse.py, because the
  # Hamburg tree register and OSM roads are too large for the repo. The site is static: deploy docs/.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: du -sh docs/data/*
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  media:
    if: contains(github.event.head_commit.message, '[video]') || contains(github.event.head_commit.message, '[posters]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Render
        shell: bash -eo pipefail {0}
        env:
          POSTERS_ONLY: ${{ contains(github.event.head_commit.message, '[video]') && '' || '1' }}
        run: |
          sudo apt-get install -y -q ffmpeg > /dev/null || true
          npm i --no-save playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          mkdir -p media && node pipeline/video.mjs 2>&1 | tee media/render.log
      - name: Push to media branch
        if: always()
        run: |
          mkdir -p /tmp/m && cp media/*.png media/*.jpg media/*.mp4 media/*.log /tmp/m/ 2>/dev/null || true
          cd /tmp/m && git init -q -b media && git config user.name Claude && git config user.email noreply@anthropic.com
          git add . && git commit -qm "Rendered media ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
