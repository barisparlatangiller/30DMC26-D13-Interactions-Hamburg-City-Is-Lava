name: film-publish
# Copies the encoded film from a finished `film` run (run id in .film-publish) to the `film-media` branch.
on:
  push:
    branches: [film]
    paths: [".film-publish"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "id=$(head -1 .film-publish | tr -dc 0-9)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: film, path: out, run-id: "${{ steps.r.outputs.id }}", github-token: "${{ github.token }}" }
      - name: Re-encode for LinkedIn (under 100 MB)
        run: |
          sudo apt-get install -y -q ffmpeg > /dev/null || true
          ffmpeg -y -loglevel error -i out/day13_squirrel_film.mp4 -c:v libx264 -preset slow -crf 20 -maxrate 10M -bufsize 20M -pix_fmt yuv420p -movflags +faststart out/film.mp4
          mv out/film.mp4 out/day13_squirrel_film.mp4 && ls -la out
      - name: Push to film-media
        run: |
          cd out && ls -la && git init -q -b film-media && git config user.name Claude && git config user.email noreply@anthropic.com
          git add . && git commit -qm "Film from run ${{ steps.r.outputs.id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" film-media
