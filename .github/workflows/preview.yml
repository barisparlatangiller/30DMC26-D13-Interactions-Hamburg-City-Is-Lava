name: preview
# Screenshots of the redesigned site with the real basemap and 3D buildings, pushed to the redesign-preview branch.
on:
  push:
    branches: [redesign]
    paths: ["docs/**", "pipeline/preview.mjs", ".github/workflows/preview.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: preview, cancel-in-progress: true }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          npm i --no-save playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          node pipeline/preview.mjs 2>&1 | tee preview/log.txt || true
          ls preview
      - run: |
          cd preview && git init -q -b redesign-preview && git config user.name Claude && git config user.email noreply@anthropic.com
          git add . && git commit -qm "Preview of ${GITHUB_SHA::7}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" redesign-preview
